kotlin.code.style=official

# cinterop 共享：thirdparty 的 C 库绑定要能在 nativeMain（两个 native 目标的公共源集）里用。
# commonization 只对「各目标同名 cinterop 的声明」做公共化，各目标实际的 .a 仍在各自 klib 里参与链接。
kotlin.mpp.enableCInteropCommonization=true

# 构建内存：kapt/KSP + Ebean 增强 + ktorfitx 代码生成需要较多堆与元空间
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
