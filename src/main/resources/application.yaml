ktor:
  deployment:
    port: 7129
  # 显式关闭 dev 模式：避免 Ktor 热重载用 OverridingClassLoader 另加载一份应用类，
  # 与 Ebean 缓存实体类身份的机制冲突（同一实体类双类加载器 → ClassCastException）
  development: false
  application:
    modules:
      - moe.lolosia.web.config.web.ApplicationConfigKt.configureApplication

# Ebean 数据源（非默认命名库 "db"，由 config/DatabaseConfig.kt 懒加载读取）
datasource:
  db:
    username: "root"
    password: "123456"
    driver: "org.mariadb.jdbc.Driver"
    url: 'jdbc:mariadb://localhost:3306/ktor-template?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8'
