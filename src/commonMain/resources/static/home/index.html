<h1>ktor-template · Kotlin/Native</h1>
<p>这个页面来自 <code>src/commonMain/resources/static/home/index.html</code>，</p>
<p>在构建期被打进 <code>classpath.zip</code> 并嵌入可执行文件，运行时由自研 <code>Classpath</code> 读出。</p>
<p>与 Java 的 <code>ClassLoader.getResourceAsStream("static/home/index.html")</code> 等价 —— 路径不用改。</p>
