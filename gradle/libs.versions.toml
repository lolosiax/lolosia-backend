[versions]
koin = "4.2.2"
koog = "0.8.0"
kotlin = "2.4.0"
logback = "1.5.37"
webjars-jquery = "4.0.0"
# ktorfitx 版本格式：<Ktor版本>-<ktorfitx版本>，需与 Ktor 版本对齐（见 settings.gradle.kts）
ktorfitx = "3.4.2-3.3.3"
ksp = "2.3.11"
kotlinx-serialization = "1.11.0"
# Ebean ORM（与 spring-project 的 orm 模块配套）
ebean = "19.4.0"
mariadb = "3.5.10"
commons-collections4 = "4.6.0"
snakeyaml = "2.6"
spring-security-crypto = "7.0.3"
hutool = "5.8.47"
spring-boot = "4.1.0"

[libraries]
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
koog-ktor = { module = "ai.koog:koog-ktor", version.ref = "koog" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
webjars-jquery = { module = "org.webjars:jquery", version.ref = "webjars-jquery" }
ktorfitx-server-core = { module = "cn.ktorfitx:server-core", version.ref = "ktorfitx" }
ktorfitx-server-annotation = { module = "cn.ktorfitx:server-annotation", version.ref = "ktorfitx" }
ktorfitx-server-ksp = { module = "cn.ktorfitx:server-ksp", version.ref = "ktorfitx" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Ebean ORM
ebean = { module = "io.ebean:ebean", version.ref = "ebean" }
ebean-platform-mariadb = { module = "io.ebean:ebean-platform-mariadb", version.ref = "ebean" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
ebean-kotlin-querybean-generator = { module = "io.ebean:kotlin-querybean-generator", version.ref = "ebean" }
commons-collections4 = { module = "org.apache.commons:commons-collections4", version.ref = "commons-collections4" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto", version.ref = "spring-security-crypto" }
commons-logging = { module = "commons-logging:commons-logging", version = "1.3.4" }
hutool-captcha = { module = "cn.hutool:hutool-captcha", version.ref = "hutool" }
webp-imageio = { module = "org.sejda.imageio:webp-imageio", version = "0.1.6" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ebean = { id = "io.ebean", version.ref = "ebean" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
